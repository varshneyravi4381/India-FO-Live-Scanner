services:
  - type: web
    name: india-fo-scanner-v27
    runtime: docker
    plan: free
    healthCheckPath: /api/cloud/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TZ
        value: Asia/Kolkata
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: scanner-backups
      - key: SUPABASE_OBJECT
        value: v27/data-backup.zip
